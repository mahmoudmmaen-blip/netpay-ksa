name: netgulf
description: NetGulf - حاسبة راتب صافي السعودية والإمارات 2026 (Offline First)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_hooks: ^0.21.2

  # Routing
  go_router: ^14.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts & PDF
  fl_chart: ^0.70.2
  pdf: ^3.11.3
  printing: ^5.14.2

  # Ads
  google_mobile_ads: ^5.3.0

  # Utils
  google_fonts: ^6.2.1
  intl: ^0.20.2
  equatable: ^2.0.7
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  # hive_generator: temporarily removed due to conflict with riverpod_generator

flutter:
  uses-material-design: true
  assets:
    - assets/images/