name: netgulf
description: NetGulf - حاسبة الراتب الصافي — السعودية والإمارات (Offline First)
publish_to: 'none'
version: 1.0.1+2          # زد الـ build number

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  flutter_hooks: ^0.21.2

  # Routing
  go_router: ^17.2.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Charts
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0

  # PDF Export
  pdf: ^3.11.3
  printing: ^5.14.2

  # Monetization
  google_mobile_ads: ^8.0.0

  # Utilities
  http: ^1.4.0
  intl: ^0.20.2
  equatable: ^2.0.7
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Recommended additions
  connectivity_plus: ^7.1.1
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  screenshot: ^3.0.0
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/privacy_policy.html